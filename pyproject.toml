[project]
name = "classbrief"
version = "0.1.0"
description = "Automatische Unterrichtsbriefings aus IServ-Materialien"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "gunicorn>=23,<24",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "PyMuPDF>=1.25,<2",
  "python-docx>=1.1,<2",
  "python-pptx>=1.0,<2",
  "openpyxl>=3.1,<4",
  "pywebpush>=2.0,<3",
  "mcp>=1.23,<2",
  "cryptography>=44,<47",
  "pyjwt[crypto]>=2.10,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<1", "respx>=0.22,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
